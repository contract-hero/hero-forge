name: Bug
description: A skill did the wrong thing in a real session.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        hero-forge runs in Claude Code only, as the `hero-forge@contract-hero` plugin.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, e.g. `to-tickets`, `grilling`.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Claude Code and plugin version
      description: e.g. Claude Code 2.1.301 and hero-forge 1.0.0 (`claude plugin list` shows the plugin version).
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and effort
      description: e.g. Opus, high effort. Roughly how full was the context when it happened?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done instead, and which line of the SKILL.md (if any) says so.
    validations:
      required: true
